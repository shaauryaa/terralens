# Search queries for scripts/collect_youtube.py (YouTube Data API v3).
# Each search.list call costs 100 quota units (10,000/day free), so keep queries <= ~40 per day.
# The script lists candidate videos first (title, channel, comment count) for review,
# then fetches comments only for approved videos (commentThreads.list: 1 unit per 100 comments).

settings:
  max_results_per_query: 50        # videos per query (API max; costs the same 100 units as 15)
  min_comment_count: 30            # skip videos with too few comments
  max_comments_per_video: 150      # cap so no video dominates
  # Lower caps for specific videos (used by `fetch`). Bengali school essay/paragraph lessons: comments are
  # mostly "thank you sir"; 50 keeps some real None comments without flooding the data.
  per_video_max_comments:
    aQyHGAgDRkM: 50   # HSC climate change paragraph (Pavel's HSC English)
    Pk3FkgKxtoA: 50   # Paragraph on global warming (Youtube technique studio)
    MLPKR1GGAmM: 50   # Summer project: global warming (Dadar Classroom)
    _z3PZP4rylM: 50   # Global warming essay (Priti Education)
    Cm_gnzWaUjk: 50   # Class 5 science: climate change (mili tutorial)
    Wh2qDrKDB9Q: 50   # Weather, climate and climate change (Lights Way)
    MCMs-VOjiSI: 50   # Climate change paragraph (Akinuzzaman Akond)
    DQcl3_JWZpE: 50   # Global warming essay (Paper and Colours)
    cWubLF2nbTI: 50   # Climate change causes and remedies (Sultan Mahmud)
  published_after: "2019-01-01T00:00:00Z"
  region_code: IN                  # Bengali queries also run with BD (see below)

# `collect_youtube.py screen`: automatic keep decision (Gemini + rule-based language check).
screening:
  screener: claude                 # claude: Claude Code writes decision files; gemini: Gemini API
  min_rule_indic_share_for_llm: 0.2   # below this rule-based Indic share -> rule_no_indic, no LLM call
  claude_batch_size: 20            # videos per Claude decision file
  model: gemini-3.8-flash          # (gemini screener only) gemini-2.5-flash is closed to new API keys
  batch_size: 5                    # (gemini screener only) 10 caused frequent 503/504 timeouts; ~20 requests/day free
  sample_comments: 20              # top-level comments sampled per video (1 YouTube unit each)
  min_sample_comments: 5           # fewer -> dropped as too_few_comments
  max_per_channel: 3
  target_per_language: [30, 35]    # aim, not quota: never keep an irrelevant video to hit it
  min_sceptic_share: 0.15
  min_seconds_between_calls: 7     # Gemini free tier allows ~10 requests per minute

hindi:
  relevance_language: hi
  queries:
    # mainstream / news / explainers
    - "जलवायु परिवर्तन"
    - "ग्लोबल वार्मिंग"
    - "climate change hindi"
    - "global warming in hindi"
    - "हीटवेव भारत"
    - "बढ़ती गर्मी जलवायु परिवर्तन"
    - "ग्लेशियर पिघल रहे हैं"
    - "बाढ़ जलवायु परिवर्तन"
    - "climate change kisan"
    - "प्रदूषण और ग्लोबल वार्मिंग"
    # sceptic-leaning, to find Against comments
    - "ग्लोबल वार्मिंग झूठ"
    - "climate change propaganda hindi"
    - "global warming scam"
    - "climate change sach ya jhooth"
    - "क्या ग्लोबल वार्मिंग एक धोखा है"

